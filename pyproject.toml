[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complexkit"            # check it is free on https://pypi.org/project/complexkit/
version = "0.2.1"              # every upload needs a NEW version number
description = "Solve complex-mapping and contour-integration problems easily in Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GURUJI", email = "icareyoufully@gmail.com" }]
keywords = ["complex analysis", "conformal mapping", "mobius", "contour integration", "residue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/care-love/complexkit"
Issues = "https://github.com/care-love/complexkit/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "numpy>=1.21"]
dev = ["pytest", "build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
complexkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
